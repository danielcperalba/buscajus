# Conjunto de avaliação da busca (F3-01; ARCHITECTURE.md, seção 7.1).
#
# PROPOSTA INICIAL, PENDENTE DE REVISÃO JURÍDICA. As consultas foram escritas como um
# usuário descreveria a situação, sem termos técnicos obrigatórios. Uma pessoa com formação
# jurídica deve revisar o texto, a área e o resultado esperado, cortar ou acrescentar
# consultas e, então, trocar "status" para "revisado", com a data e o responsável.
#
# Campos: id (estável), texto, area, obrigatoria (caso que precisa passar, ex.: F6-07) e
# esperado (o que um bom resultado traz, para orientar o julgamento).
versao: 1
status: pendente de revisão jurídica
revisao: {data: null, responsavel: null}

