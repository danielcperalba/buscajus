[project]
name = "buscajus"
version = "0.1.0"
description = "Busca semântica de jurisprudência brasileira a partir de fontes oficiais"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "lxml>=5.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
buscajus-worker = "buscajus.worker:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buscajus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PTH", "DTZ",
]
ignore = [
    "RUF001", "RUF002", "RUF003", # textos em português usam caracteres como "º" e "–"
    "N818", # exceções com nomes em português ("ErroColeta", "UnidadeSemDados")
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/buscajus/db/migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["buscajus"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Aviso interno do TestClient do Starlette (fora do nosso código); os demais continuam visíveis.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "banco: teste que exige PostgreSQL com pgvector (BUSCAJUS_TEST_DATABASE_URL)",
]
