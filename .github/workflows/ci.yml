name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: buscajus
          POSTGRES_PASSWORD: buscajus
          POSTGRES_DB: buscajus_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buscajus -d buscajus_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BUSCAJUS_TEST_DATABASE_URL: postgresql+psycopg://buscajus:buscajus@localhost:5432/buscajus_teste
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov

  # Embeddings com modelo real minúsculo (grupo opcional "embeddings", torch CPU). O job
  # principal roda sem o grupo, e esses testes são pulados lá.
  backend-modelo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-stsb-bert-tiny-f3cb857c
      - run: uv sync --frozen --group embeddings
      - run: uv run pytest -m modelo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # F6-09: fluxo do site no navegador contra a API em modo mock (dados sintéticos fixos).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - run: uv sync --frozen
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
